<!doctype html>
<html lang="en">
  <head>
    <base href="https://www.w3schools.com/" target="_blank" />
    <!-- The <base> tag specifies the base URL and/or target for all relative URLs in a document. -->
    <!-- The <base> tag must have either an href or a target attribute present, or both. -->
    <!-- There can only be one single <base> element in a document, and it must be inside the <head> element. -->
    <!-- href	URL	Specifies the base URL for all relative URLs in the page -->
    <!-- target	_blank -->
    <!--    _parent -->
    <!--    _self -->
    <!--    _top	Specifies the default target for all hyperlinks and forms in the page -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <style>h1 {color: red;}p {color: blue;}</style> -->
<html>
    <link rel="stylesheet" href="styles.css" />
    <!-- 
        crossorigin - Indicates whether the resource should be fetched with a CORS request. 
                     It is used when the resource is on a different origin (domain) than the document. 
                     The crossorigin attribute can have two values: "anonymous" and "use-credentials". 
                     If the crossorigin attribute is not specified, the resource will be fetched without CORS, 
                     which means that it will not include credentials (like cookies or HTTP authentication) and 
                     will not be able to access certain features of the resource (like the response headers).
            crossorigin="anonymous" - The browser sends a cross-origin request without credentials 
                                  (like cookies or HTTP authentication). 
                                  If the server does not allow cross-origin requests, 
                                  the resource will be blocked and an error will be logged in the console.
            crossorigin="use-credentials" - The browser sends a cross-origin request with credentials (like cookies or HTTP authentication). 
                                  If the server does not allow cross-origin requests with credentials, 
                                  the resource will be blocked and an error will be logged in the console.
    -->
    <!--
        href - Specifies the URL of the linked resource. 
               The value of the href attribute can be an absolute URL, a root-relative URL, or a relative URL. 
               The browser will resolve the URL based on the location of the document and the base URL (if specified).
            href="https://www.w3schools.com/css/styles.css" - Absolute URL
            href="/css/styles.css" - Root-relative URL
            href="styles.css" - Relative URL    
    -->
    <!--
        hrflang - Specifies the language of the linked resource. 
                   The value of the hrflang attribute should be a valid language code, 
                   such as "en" for English, "es" for Spanish, "fr" for French, etc. 
                   This attribute is used to indicate the language of the linked resource, 
                   which can help search engines and browsers to better understand the content and provide appropriate translations or alternatives.
            hrflang="en" - English
            hrflang="es" - Spanish
            hrflang="fr" - French
        ...
    -->
        ... etc etc
    <!-- 
        rel attribute values:
        rel="alternate"
        rel="author"
        rel="canonical"
        rel="dns-prefetch"
        rel="help"
        rel="icon"
        rel="license"
        rel="manifest"

        rel="prefetch"
        rel="preload"
        rel="prerender"
        rel="prev"

        rel="stylesheet"
        rel="tag" 
    -->

    crossorigin="anonymous" crossorigin="use-credentials"

      crossorigin="use-credentials"
    />
